<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">LLM Education — observable AI agents</title><desc id="desc">Architecture illustration: a request reaches an LLM planner, tools return evidence through code-based review, and the same model synthesizes an answer.</desc>
